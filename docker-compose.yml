services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobfit
      POSTGRES_PASSWORD: jobfit
      POSTGRES_DB: jobfit
    ports:
      - "5432:5432"
    volumes:
      - jobfit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfit -d jobfit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PROFILE_YAML_PATH: /app/data/candidate_profile.yaml
      CV_PATH: /app/data/cv.pdf
      DATABASE_URL: postgresql+asyncpg://jobfit:jobfit@db:5432/jobfit
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      # Local/demo assets override the non-PII fallback baked into the image.
      - ./assets:/app/assets
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NGINX_CONF: nginx.conf
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    command: celery -A backend.celery_app:celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jobfit:jobfit@db:5432/jobfit
      REDIS_URL: redis://redis:6379/0
      PROFILE_YAML_PATH: /app/data/candidate_profile.yaml
      CV_PATH: /app/data/cv.pdf
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.celery_app:celery_app inspect ping --timeout=5 >/dev/null || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 3

  beat:
    build:
      context: .
      target: beat
    restart: unless-stopped
    command: celery -A backend.celery_app:celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jobfit:jobfit@db:5432/jobfit
      REDIS_URL: redis://redis:6379/0
      PROFILE_YAML_PATH: /app/data/candidate_profile.yaml
      CV_PATH: /app/data/cv.pdf
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  jobfit_pgdata:
