name: AWS ECS Migrate

on:
  workflow_dispatch:
    inputs:
      task_definition:
        description: ECS task definition family or ARN to run
        required: false
        default: jobfit-api
      container_name:
        description: Container to override
        required: false
        default: api

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  ECS_CLUSTER: jobfit-cluster

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate network configuration inputs
        run: |
          test -n "${{ vars.AWS_ECS_SUBNETS }}" || (echo "Set GitHub variable AWS_ECS_SUBNETS to comma-separated private subnet IDs" && exit 1)
          test -n "${{ vars.AWS_ECS_SECURITY_GROUPS }}" || (echo "Set GitHub variable AWS_ECS_SECURITY_GROUPS to comma-separated ECS task security group IDs" && exit 1)

      - name: Run Alembic migration task
        id: run-task
        env:
          TASK_DEFINITION: ${{ inputs.task_definition }}
          CONTAINER_NAME: ${{ inputs.container_name }}
          SUBNETS: ${{ vars.AWS_ECS_SUBNETS }}
          SECURITY_GROUPS: ${{ vars.AWS_ECS_SECURITY_GROUPS }}
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$TASK_DEFINITION" \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=DISABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"$CONTAINER_NAME\",\"command\":[\"alembic\",\"upgrade\",\"head\"]}]}" \
            --query 'tasks[0].taskArn' \
            --output text)
          test "$TASK_ARN" != "None" || (echo "Failed to start migration task" && exit 1)
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"

      - name: Wait for migration task
        run: aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "${{ steps.run-task.outputs.task_arn }}"

      - name: Check migration exit code
        run: |
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "${{ steps.run-task.outputs.task_arn }}" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "${{ steps.run-task.outputs.task_arn }}"
            exit 1
          fi
          echo "Migration completed successfully"
