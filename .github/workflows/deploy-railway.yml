name: Deploy Railway

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only one Railway deploy at a time, mirroring deploy-aws.yml's guard.
concurrency:
  group: deploy-railway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # api migrates on startup (RUN_MIGRATIONS_ON_STARTUP=true) — no separate
      # migration step needed, unlike deploy-aws.yml's one-off ECS task.
      - name: Deploy api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service api --ci

      - name: Deploy worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service worker --ci

      - name: Deploy beat
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service beat --ci

      # --path-as-root scopes the build context to frontend/ instead of the repo
      # root — `railway up`'s default "current directory" is the linked project
      # root regardless of cwd (see docs/railway.md "CLI gotchas").
      - name: Deploy frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up frontend --path-as-root --service frontend --ci
