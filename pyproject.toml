[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session so the session-scoped Postgres engine and
# the per-test connections live on the same loop (asyncpg binds to its loop).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--cov=backend --cov-report=term-missing --cov-fail-under=70 -m 'not integration'"
markers = [
    "integration: tests that call the real Anthropic API (deselected by default)",
]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.mypy]
strict = true
ignore_missing_imports = true
